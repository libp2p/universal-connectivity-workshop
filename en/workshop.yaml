    - "rs/05-identify-checkpoint"
    - "rs/06-gossipsub-checkpoint"
    - "rs/07-kademlia-checkpoint"
    - "rs/08-final-checkpoint"
  js:
    - "js/01-identity-and-swarm"
    - "js/02-tcp-transport"
    - "js/03-ping-checkpoint"
    - "js/04-circuit-relay-v2"
    - "js/05-identify-protocol"
    - "js/06-gossipsub-checkpoint"
    - "js/07-kademlia-checkpoint"
    - "js/08-final-checkpoint"
