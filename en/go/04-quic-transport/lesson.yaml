title: QUIC Transport
description: >
  Add QUIC transport to your libp2p host for modern, efficient connectivity.
  QUIC provides built-in encryption, multiplexing, and improved performance
  over UDP. Learn how to configure multiple transports and understand their
  trade-offs.
status: NotStarted
objectives:
  - Understand QUIC transport benefits
  - Configure QUIC alongside TCP
  - Handle multi-transport scenarios
  - Understand UDP vs TCP trade-offs
  - Test QUIC connectivity
concepts:
  - QUIC Protocol
  - UDP Transport
  - Multi-Transport Support
  - Built-in Encryption
  - Transport Selection
difficulty: intermediate
estimated_time: 40
prerequisites:
  - 03-ping-checkpoint
